name: Install portfolio favicon

on:
  push:
    paths:
      - '.github/workflows/install-favicon.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add favicon links
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<link rel="icon" href="favicon.svg" type="image/svg+xml">'
          for name in ['index.html', 'resume.html']:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'href="favicon.svg"' in text:
                  continue
              if '</title>' in text:
                  text = text.replace('</title>', '</title>\n' + tag, 1)
              else:
                  text = text.replace('</head>', tag + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit favicon links
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html resume.html
          git commit -m "Use custom RB favicon"
          git push
