name: Switch portfolio favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point pages to terminal favicon
        run: |
          sed -i 's#favicon\.svg#terminal-favicon.svg#g' index.html
          if [ -f resume.html ]; then
            if grep -q 'rel="icon"' resume.html; then
              sed -i 's#favicon\.svg#terminal-favicon.svg#g' resume.html
            else
              sed -i 's#</head>#<link rel="icon" href="terminal-favicon.svg" type="image/svg+xml">\n</head>#' resume.html
            fi
          fi
      - name: Commit changes
        run: |
          git config user.name "RyskeldievB"
          git config user.email "110464659+RyskeldievB@users.noreply.github.com"
          git add index.html resume.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use terminal favicon"
          git push
