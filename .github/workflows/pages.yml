name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare portfolio
        shell: bash
        run: |
          python3 scripts/apply_mobile_compact.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          mobile_css = '<link rel="stylesheet" href="mobile-final.css?v=3">'
          desktop_css = '<link rel="stylesheet" href="desktop-final.css?v=8">'
          studio_css = '<link rel="stylesheet" href="studio-desktop.css?v=2">'
          project_case_css = '<link rel="stylesheet" href="project-case-desktop.css?v=1">'
          micro_css = '<link rel="stylesheet" href="micro-interactions.css?v=1">'
          carousel = '<script src="carousel-autoplay.js?v=6"></script>'
          mobile_content = '<script src="mobile-content.js?v=2"></script>'
          desktop_js = '<script src="desktop-compact.js?v=5"></script>'
          micro_js = '<script src="micro-interactions.js?v=1"></script>'

          for old in [
              '<link rel="stylesheet" href="mobile-final.css?v=1">',
              '<link rel="stylesheet" href="mobile-final.css?v=2">']:
              html = html.replace(old, mobile_css)
          for old in [
              '<link rel="stylesheet" href="desktop-final.css?v=1">',
              '<link rel="stylesheet" href="desktop-final.css?v=2">',
              '<link rel="stylesheet" href="desktop-final.css?v=3">',
              '<link rel="stylesheet" href="desktop-final.css?v=4">',
              '<link rel="stylesheet" href="desktop-final.css?v=5">',
              '<link rel="stylesheet" href="desktop-final.css?v=6">',
              '<link rel="stylesheet" href="desktop-final.css?v=7">']:
              html = html.replace(old, desktop_css)
          html = html.replace('<link rel="stylesheet" href="studio-desktop.css?v=1">', studio_css)
          html = html.replace('<script src="mobile-content.js?v=1"></script>', mobile_content)
          for old in [
              '<script src="desktop-compact.js?v=1"></script>',
              '<script src="desktop-compact.js?v=2"></script>',
              '<script src="desktop-compact.js?v=3"></script>',
              '<script src="desktop-compact.js?v=4"></script>']:
              html = html.replace(old, desktop_js)

          for old in [
              '<link rel="stylesheet" href="cursor-effect.css?v=1">',
              '<link rel="stylesheet" href="cursor-effect.css?v=2">']:
              html = html.replace(old, '')

          if mobile_css not in html:
              html = html.replace('</head>', mobile_css + '\n</head>')
          if desktop_css not in html:
              html = html.replace('</head>', desktop_css + '\n</head>')
          if studio_css not in html:
              html = html.replace('</head>', studio_css + '\n</head>')
          if project_case_css not in html:
              html = html.replace('</head>', project_case_css + '\n</head>')
          if micro_css not in html:
              html = html.replace('</head>', micro_css + '\n</head>')
          if carousel not in html:
              html = html.replace('</body>', carousel + '\n</body>')
          if mobile_content not in html:
              html = html.replace('</body>', mobile_content + '\n</body>')
          if desktop_js not in html:
              html = html.replace('</body>', desktop_js + '\n</body>')
          if micro_js not in html:
              html = html.replace('</body>', micro_js + '\n</body>')

          p.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
