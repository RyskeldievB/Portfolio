name: Apply clearer favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update favicon reference
        run: |
          sed -i 's/terminal-terminal-favicon\.svg/favicon-v3.svg/g' index.html
          sed -i 's/terminal-favicon\.svg/favicon-v3.svg/g' index.html
          sed -i 's/favicon\.svg/favicon-v3.svg/g' index.html
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No favicon change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use clearer favicon"
          git push
