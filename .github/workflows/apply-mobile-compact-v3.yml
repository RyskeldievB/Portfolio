name: Apply mobile compact v3

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-compact-v3.yml'
      - 'scripts/apply_mobile_compact.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python scripts/apply_mobile_compact.py
      - name: Commit index changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply compact mobile layout v3"
          git push
