name: Polish skill card numbers

on:
  push:
    paths:
      - '.github/workflows/polish-skill-numbers.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve skill number badges
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.skill{padding:20px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.03)}.skill .icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(104,169,255,.18),rgba(121,240,196,.12));margin-bottom:14px;font-weight:800;color:var(--accent)}'
          new='.skill{padding:24px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.025));position:relative;overflow:visible}.skill .icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:18px;font-weight:900;font-size:16px;letter-spacing:.6px;color:#06111f;border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 28px rgba(104,169,255,.22),inset 0 1px 0 rgba(255,255,255,.28)}.skill:hover .icon{transform:translateY(-2px) scale(1.04);box-shadow:0 14px 34px rgba(104,169,255,.32)}'
          if old in s:
              s=s.replace(old,new,1)
          else:
              s=s.replace('</style>','\n/* skill-number-polish */\n'+new+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make skill number badges more visible"
          git push
