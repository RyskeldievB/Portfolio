name: Fix inline favicon

on:
  push:
    paths:
      - '.github/workflows/fix-favicon-inline.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace favicon with inline SVG
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          favicon = '''<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%2368A9FF'/%3E%3Cstop offset='1' stop-color='%2379F0C4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2307101F'/%3E%3Crect x='4' y='4' width='56' height='56' rx='13' fill='url(%23g)'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='900' fill='%2307101F'%3EB%3C/text%3E%3C/svg%3E">'''
          s = re.sub(r'<link rel="icon"[^>]*>', favicon, s, count=1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Embed stable readable favicon" || exit 0
          git push
